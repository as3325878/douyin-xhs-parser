[build]
  publish = "public"
  functions = "netlify/functions"
  command = ""

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/**"]

# 所有路径重写到同一个函数：/ /health /parse /platforms /ready /metrics /status /media/*
# status=200 是 rewrite（浏览器地址栏不变，event.path 仍是原始路径）
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/parse"
  status = 200
  force = true

[build.environment]
  BROWSER_FALLBACK = "off"
  NODE_VERSION = "20"
